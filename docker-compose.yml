version: '3.9'

services:
  bot:
    build: ./bot
    env_file: .env
    depends_on: [mongo, redis]
    restart: always
    networks: [vcnet]

  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [mongo, redis]
    restart: always
    networks: [vcnet]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  frontend:
    build: ./frontend
    ports: ["5000:80"]
    restart: always
    networks: [vcnet]

  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    networks: [vcnet]
    restart: always

  redis:
    image: redis:7-alpine
    networks: [vcnet]
    restart: always

  livekit:
    image: livekit/livekit-server:latest
    command: --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50050:50000-50050/udp"
    networks: [vcnet]
    restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on: [backend, frontend, livekit]
    networks: [vcnet]
    restart: always

volumes:
  mongo_data:

networks:
  vcnet:
