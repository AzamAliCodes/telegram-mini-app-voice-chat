[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    # Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://telegram.org https://*.cdn-telegram.org https://*.telegram-cdn.org; connect-src 'self' wss: https:; font-src 'self' data:; media-src 'self' blob:; frame-ancestors 'self' https://web.telegram.org https://oauth.telegram.org https://*.telegram.org;"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
