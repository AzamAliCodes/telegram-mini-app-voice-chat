events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Basic Settings
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  15; # Lowered to recycle connections faster
    server_tokens off;

    # 1. IDENTIFY REAL USER IP (Trusting Azure & Hugging Face)
    # Trust Azure Front Door ranges
    set_real_ip_from 13.107.246.0/24;
    set_real_ip_from 13.107.252.0/24;
    # Trust Hugging Face internal proxies (typical Docker/K8s ranges)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    
    # Use X-Forwarded-For to find the real client
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 2. DEFINE ANTI-DDOS ZONES
    # Limit requests per second per ACTUAL User IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    # Limit concurrent connections per ACTUAL User IP (Max 10)
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 3. MITIGATE SLOWLORIS (Fast timeouts)
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    large_client_header_buffers 2 1k;

    server {
        listen 80;
        server_name _; # Catch-all for Hugging Face

        # Mini App (Netlify/React)
        location / {
            limit_conn conn_limit 20;
            
            proxy_pass http://frontend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # LiveKit / Backend API
        location /api/ {
            # Aggressive rate limit for API calls
            limit_req zone=api_limit burst=10 delay=5;
            limit_conn conn_limit 5;

            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket
        location /ws/ {
            limit_conn conn_limit 3; # Only 3 WS connections per user
            
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
