events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Basic Settings
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  15; # Lowered to recycle connections faster
    server_tokens off;

    # 1. IDENTIFY REAL USER IP (Trusting Azure & Hugging Face)
    # Trust Azure Front Door ranges
    set_real_ip_from 13.107.246.0/24;
    set_real_ip_from 13.107.252.0/24;
    # Trust Hugging Face internal proxies (typical Docker/K8s ranges)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    
    # Use X-Forwarded-For to find the real client
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 2. DEFINE ANTI-DDOS ZONES
    # Limit requests: 5 requests per second with a small burst of 10
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    # Limit concurrent connections: Max 5 per IP to prevent Slowloris
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 3. GLOBAL SECURITY & PERFORMANCE
    client_body_timeout 5s;     # Aggressive timeout for slow attackers
    client_header_timeout 5s;
    send_timeout 5s;
    keepalive_timeout 10s;
    large_client_header_buffers 2 1k;
    client_max_body_size 1m;    # Prevent large payload attacks

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    server {
        listen 80;
        server_name _;

        # DDoS Protection active globally
        limit_req zone=api_limit burst=10 delay=5;
        limit_conn conn_limit 10;

        # Mini App
        location / {
            proxy_pass http://frontend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Throttling
        location /api/ {
            limit_req zone=api_limit burst=5; # Stricter for API
            limit_conn conn_limit 5;

            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket Security
        location /ws/ {
            limit_conn conn_limit 2; # Strict limit for sockets
            
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
